name: diaba_mobile
description: Application mobile de la marketplace sénégalaise Diaba
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP Client
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.4.0

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Shared Preferences
  shared_preferences: ^2.3.0

  # Images
  cached_network_image: ^3.3.1

  # UI Components
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  smooth_page_indicator: ^1.1.0
  flutter_staggered_grid_view: ^0.7.0

  # Carousel
  carousel_slider: ^5.0.0

  # Fonts
  google_fonts: ^6.2.1

  # Icons
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.0
  timeago: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
